[build]
  command = "npm run build"
  publish = "dist"
  # No build (so no credit used) when nothing changed in the website: backend-only pushes are skipped.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

# Pull-request previews and branch deploys are not needed: only the main branch is built.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
